name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v tests.test_unit tests.test_features tests.test_admin tests.test_deploy tests.test_ops tests.test_telegram_pairing tests.test_cluster_sync_http tests.test_member_page
      - run: python -m compileall -q vps2vpn tools deploy

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh deploy-mac.command tests/vps_acceptance.sh tests/container_install.sh
      - run: node --check vps2vpn/static/app.js && node --check vps2vpn/static/kit.js && node --check vps2vpn/static/member.js
      - name: PowerShell deployer parses and builds its window
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/deploy.ps1", [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }

  e2e:
    # real servers (Xray, Hysteria 2) and real clients (mihomo, sing-box) on one machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned cores and clients
        run: |
          set -e
          XRAY=$(python3 -c 'import vps2vpn; print(vps2vpn.XRAY_VERSION)')
          HY=$(python3 -c 'import vps2vpn; print(vps2vpn.HYSTERIA_VERSION.split("/")[-1])')
          mkdir -p bins && cd bins
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/$XRAY/Xray-linux-64.zip"
          unzip -q Xray-linux-64.zip -d xray && rm Xray-linux-64.zip
          curl -fsSL -o hysteria "https://github.com/apernet/hysteria/releases/download/app/$HY/hysteria-linux-amd64"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz" | gunzip > mihomo
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz" | tar xz
          mv sing-box-*/sing-box . && rm -rf sing-box-1.14.4-linux-amd64
          chmod +x hysteria mihomo sing-box xray/xray
      - name: End-to-end
        env:
          V2V_E2E_TARGET: www.amd.com
        run: python3 tests/e2e_local.py bins
      - name: Print core and controlled-benchmark diagnostics
        if: failure()
        run: |
          for log in /tmp/v2v-e2e-*/benchmark.*.log /tmp/v2v-e2e-*/mihomo-*.log /tmp/v2v-e2e-*/xray.log /tmp/v2v-e2e-*/tuic.log; do
            [ -f "$log" ] || continue
            printf '\\n== %s ==\\n' "$log"
            tail -n 40 "$log"
          done

  install:
    # the real installer on a fresh Ubuntu runner, then the acceptance checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install from this checkout
        run: |
          tar -czf /tmp/v.tgz --exclude=__pycache__ install.sh vps2vpn
          sudo V2V_SRC=/tmp/v.tgz bash install.sh install
      - name: Complete first-run setup before demanding active proxy services
        run: |
          sudo env PYTHONPATH=/usr/local/lib/vps2vpn/app python3 -c 'from vps2vpn.__main__ import quick_setup; quick_setup()'
          sudo vps2vpn apply --force
          sudo vps2vpn rules
      - name: Acceptance checks
        run: sudo V2V_SRC=/tmp/v.tgz bash tests/vps_acceptance.sh --full
      - name: Print installer service journal on failure
        if: failure()
        run: sudo journalctl -u vps2vpn -u vps2vpn-xray -u vps2vpn-hysteria -u vps2vpn-tuic -n 100 --no-pager

  install-distros:
    # the real installer in a container per distro people rent VPSes with, systemd as PID 1:
    # fresh install, panel answers on its port, upgrade snapshot keeps the database, rollback, reinstall
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:11', 'debian:12', 'ubuntu:20.04', 'ubuntu:22.04', 'ubuntu:24.04',
                'almalinux:9', 'rockylinux/rockylinux:8']
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/container_install.sh '${{ matrix.image }}'
